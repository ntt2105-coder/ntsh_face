<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南投高中校園人臉辨識迎賓系統</title>
<style>
:root{--bg:#0b1220;--panel:#141d33;--panel2:#1b2742;--line:#2a3a5e;--text:#f4f7ff;--muted:#9fb0d0;--accent:#ffcf4a;--ok:#3ddc97;--bad:#ff6b6b;--blue:#4aa3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:16px}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--blue)}
button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700}
button.danger{background:#3a1b25;border-color:#7a2c3c;color:#ffb3bd}
button.on{background:var(--blue);color:#06101f;border-color:var(--blue);font-weight:700}
input,select,textarea{background:#0e1730;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:14px}
label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:15px}
label.chk input{width:auto;margin-top:4px}
/* 頂端列 */
#topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#0a1020;border-bottom:1px solid var(--line)}
#topbar .brand{font-weight:700;font-size:18px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 迎賓畫面 */
#kiosk{height:calc(100dvh - 56px);display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;padding:16px}
.stage{display:flex;align-items:center;justify-content:center;min-height:0}
.camwrap{position:relative;width:min(100%,calc((100dvh - 100px)*var(--arn,1.778)));aspect-ratio:var(--arn,1.778);background:#000;border-radius:18px;overflow:hidden;border:2px solid var(--line)}
.camwrap video{width:100%;height:100%;object-fit:fill;transform:scaleX(-1);display:block}
.camwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#camHint{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,107,107,.92);color:#2a0b10;padding:8px 12px;border-radius:10px;font-weight:700;text-align:center}
.info{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;overflow:auto}
.info img{max-height:120px;max-width:70%;object-fit:contain}
.info h1{margin:0;font-size:clamp(28px,3.6vw,52px);line-height:1.2}
#clock{font-size:clamp(48px,7vw,104px);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
#dateText{font-size:clamp(18px,2vw,30px);color:var(--muted)}
#announce{font-size:clamp(20px,2.4vw,36px);line-height:1.6;margin-top:8px}
#statusLine{margin-top:auto;font-size:14px;color:var(--muted)}
/* 歡迎畫面 */
#welcome{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#1f3b78,#0b1220 70%);animation:fadeIn .4s ease}
#welcome.stranger{background:radial-gradient(circle at 50% 40%,#3d3a1f,#0b1220 70%)}
.w-inner{position:relative;z-index:2;padding:24px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
#wIcon{font-size:clamp(60px,10vw,140px)}
#wTitle{font-size:clamp(36px,7vw,110px);font-weight:800;line-height:1.25;color:#fff;text-shadow:0 4px 30px rgba(74,163,255,.6)}
#wSub{margin-top:18px;font-size:clamp(22px,3.4vw,52px);color:var(--accent)}
#confetti{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
.cf{position:absolute;top:-30px;width:12px;height:18px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
/* 開始畫面 */
#startOverlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:560px;width:100%;text-align:center}
.card h2{margin:0 0 8px;font-size:26px}
#startMsg{margin:14px 0;color:var(--muted);line-height:1.7;white-space:pre-line}
#startMsg.err{color:#ffb3bd}
/* 管理頁 */
#admin{height:calc(100dvh - 56px);overflow:auto;padding:16px}
.wrap{max-width:1100px;margin:0 auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row>*{flex:0 0 auto}
.row input[type=search],.row input[type=text]{flex:1 1 200px;width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}#kiosk{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
@media(max-aspect-ratio:1/1){#kiosk{grid-template-columns:1fr;grid-template-rows:auto 1fr}.camwrap{width:100%}}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;white-space:nowrap}
td button{padding:4px 10px;font-size:14px;margin-right:4px}
.tblwrap{overflow:auto;max-height:55vh}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#22304f;color:var(--muted)}
.badge.ok{background:#12382b;color:var(--ok)}
.badge.bad{background:#3a1b25;color:#ffb3bd}
.note{color:var(--muted);font-size:14px;line-height:1.7}
.warn{background:#3a2f14;border:1px solid #7a6420;color:#ffe08a;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px;line-height:1.7}
.regcam{position:relative;background:#000;border-radius:12px;overflow:hidden}
.regcam video{width:100%;display:block;transform:scaleX(-1)}
#r_thumbs{display:flex;gap:8px;margin:10px 0;min-height:64px}
#r_thumbs canvas{width:64px;height:64px;border-radius:8px;border:2px solid var(--ok)}
#r_msg{min-height:22px;font-size:14px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.6)}
.range{display:flex;gap:10px;align-items:center}
.range input{flex:1}
</style>
</head>
<body>

<!-- 開始畫面:需使用者點擊,才能啟用鏡頭與語音 -->
<div id="startOverlay">
  <div class="card">
    <h2 id="startTitle">校園人臉辨識迎賓系統</h2>
    <div id="startMsg">按下「開始迎賓」後,系統會載入辨識模型並啟用鏡頭。\n(首次載入需連網下載模型)</div>

    <div style="margin-top:14px"><button id="adminOnlyBtn" style="font-size:14px">僅進入管理頁(不啟用鏡頭)</button></div>

</div>

<header id="topbar">
  <div class="brand" id="brand">南投高中 迎賓系統</div>
  <button id="navKiosk" class="on">迎賓畫面</button>
  <button id="navAdmin">管理</button>

</header>

<!-- ============ 迎賓畫面 ============ -->
<section id="kiosk">

<section id="admin" class="hidden">

            <div>

<!-- 編輯人員 -->

<script>
/* ================================================================
 * 南投高中校園人臉辨識迎賓系統
 * - 臉部偵測/辨識:face-api.js(@vladmandic 版本,從 CDN 載入)
 * - 資料儲存:瀏覽器 IndexedDB(人員、紀錄)與 localStorage(設定)
 * - 不上傳任何資料、不儲存原始照片,僅存臉部特徵向量
 * ================================================================ */

/* ---------- 共用工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ROLES = ['教師', '職員', '學生', '貴賓', '家長'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const pad = n => String(n).padStart(2, '0');
const fmtTime = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtDate = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

/* ---------- 設定 ---------- */
const DEFAULTS = {
  schoolName: '國立南投高中', logo: '', announce: '歡迎蒞臨本校\n請依指示完成報到',
  threshold: 0.5, voice: true, volume: 1, cooldown: 30, welcomeMs: 3000, retentionDays: 365,
  tplStaff: '{name}老師,{greet}', tplStudent: '{name}同學,歡迎回來',
  tplGuest: '歡迎{name},感謝蒞臨本校', tplStranger: '歡迎蒞臨本校,請先至警衛室/報到處登記',
  pwHash: ''
};
let settings = Object.assign({}, DEFAULTS);
try { Object.assign(settings, JSON.parse(localStorage.getItem('ntsh_settings') || '{}')); } catch (e) {}
function saveSettings() {
  try { localStorage.setItem('ntsh_settings', JSON.stringify(settings)); } catch (e) { alert('設定儲存失敗(可能是儲存空間已滿或無痕模式)。'); }
}

/* ---------- IndexedDB ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('ntsh-welcome', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('people', { keyPath: 'id' });
      const l = d.createObjectStore('logs', { keyPath: 'id', autoIncrement: true });
      l.createIndex('t', 't');
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    const rq = fn(s);
    if (rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbAll = s => tx(s, 'readonly', o => o.getAll());
const dbPut = (s, v) => tx(s, 'readwrite', o => o.put(v));
const dbDel = (s, k) => tx(s, 'readwrite', o => o.delete(k));
const dbClear = s => tx(s, 'readwrite', o => o.clear());

/* ---------- 人員快取與比對 ---------- */
let people = [];
let matchers = [];
async function reloadPeople() {
  people = await dbAll('people');
  // 預先把特徵向量轉成 Float32Array,加速比對
  matchers = people.filter(p => p.descriptors && p.descriptors.length)
    .map(p => ({ p, ds: p.descriptors.map(d => Float32Array.from(d)) }));
}
function matchFace(desc) {
  let best = null, bd = 9;
  for (const m of matchers) {
    for (const d of m.ds) {
      const dist = faceapi.euclideanDistance(desc, d);
      if (dist < bd) { bd = dist; best = m.p; }
    }
  }
  return (best && bd < settings.threshold) ? { p: best, dist: bd } : null;
}

/* ---------- 載入 face-api.js ---------- */

];
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('載入失敗:' + src));
    document.head.appendChild(s);
  });
}
let modelsReady = false;
async function loadModels(setMsg) {
  if (modelsReady) return;
  let lastErr;
  for (const base of CDN_BASES) {
    try {
      setMsg('正在載入辨識程式庫…');
      if (!window.faceapi) await loadScript(base + '/dist/face-api.js');
      setMsg('正在下載辨識模型(約 10 MB)…');
      const url = base + '/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(url);
      await faceapi.nets.faceLandmark68Net.loadFromUri(url);
      await faceapi.nets.faceRecognitionNet.loadFromUri(url);
      modelsReady = true;
      return;
    } catch (e) { lastErr = e; console.warn(e); }
  }
  throw new Error('無法載入辨識模型,請確認網路連線後重試。\n(' + (lastErr && lastErr.message) + ')');
}

/* ---------- 鏡頭 ---------- */
const video = $('#video'), video2 = $('#video2');
const overlay = $('#overlay'), octx = overlay.getContext('2d');
let stream = null;
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('此瀏覽器或連線方式無法使用鏡頭。\n請用 https:// 或 localhost 開啟本頁,並使用新版 Chrome / Edge / Safari。');
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
  } catch (e) {
    let msg = '無法啟用鏡頭:' + e.name;
    if (e.name === 'NotAllowedError' || e.name === 'SecurityError')
      msg = '鏡頭權限被拒絕。\n請點網址列左側的鎖頭/相機圖示 → 允許「相機」→ 重新整理頁面,再按「開始迎賓」。';
    else if (e.name === 'NotFoundError' || e.name === 'OverconstrainedError')
      msg = '找不到可用的鏡頭,請確認裝置已連接鏡頭。';
    else if (e.name === 'NotReadableError')
      msg = '鏡頭正被其他程式使用,請關閉其他使用鏡頭的程式或視窗後重試。';
    throw new Error(msg);
  }
  video.srcObject = stream; video2.srcObject = stream;
  await video.play();
  video2.play().catch(() => {});
  await new Promise(r => { if (video.videoWidth) r(); else video.onloadedmetadata = r; });
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  $('#camwrap').style.setProperty('--arn', (video.videoWidth / video.videoHeight).toFixed(4));
}

/* ---------- 辨識主迴圈 ---------- */
let view = 'kiosk';
let running = false;
const streak = {};
function drawLabel(x, y, w, text, color) {
  const fs = Math.max(18, overlay.width / 45);
  octx.font = `700 ${fs}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
  const tw = octx.measureText(text).width + 16;
  const th = fs + 12;
  const lx = Math.max(0, Math.min(x, overlay.width - tw));
  const ly = y - th < 0 ? y + 2 : y - th;
  octx.fillStyle = color; octx.fillRect(lx, ly, tw, th);
  octx.fillStyle = '#0b1220'; octx.textBaseline = 'middle'; octx.fillText(text, lx + 8, ly + th / 2);
}
function handleDetections(dets) {
  const W = overlay.width, H = overlay.height;
  octx.clearRect(0, 0, W, H);
  const seen = new Map();
  for (const d of dets) {
    const b = d.detection.box;
    const m = matchFace(d.descriptor);
    const key = m ? m.p.id : 'stranger';
    const x = W - b.x - b.width; // 畫面左右鏡像,座標需翻轉
    octx.lineWidth = Math.max(3, W / 300);
    octx.strokeStyle = m ? '#3ddc97' : '#ffcf4a';
    octx.strokeRect(x, b.y, b.width, b.height);
    drawLabel(x, b.y, b.width, m ? `${m.p.name}(${m.p.role})` : '訪客', m ? '#3ddc97' : '#ffcf4a');
    const area = b.width * b.height;
    const prev = seen.get(key);
    if (!prev || prev.area < area) seen.set(key, { area, p: m ? m.p : null });
  }
  // 連續出現次數:避免單張畫面誤判
  for (const k of Object.keys(streak)) if (!seen.has(k)) delete streak[k];
  for (const k of seen.keys()) streak[k] = (streak[k] || 0) + 1;
  if (welcoming) return;
  const now = Date.now();
  let cand = null;
  for (const [k, v] of seen) {
    if (k === 'stranger') continue;
    if (streak[k] >= 2 && now - (lastWelcome[k] || 0) > settings.cooldown * 1000) {
      if (!cand || v.area > cand.area) cand = v; // 優先歡迎畫面中最近(臉最大)的人
    }
  }
  if (cand) { welcome(cand.p); return; }
  if (seen.has('stranger') && streak.stranger >= 4 && now - (lastWelcome.stranger || 0) > 15000) welcome(null);
}
async function loop() {
  if (!running || view !== 'kiosk') { setTimeout(loop, 400); return; }
  const t0 = performance.now();
  try {
    const dets = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.45 }))
      .withFaceLandmarks().withFaceDescriptors();
    handleDetections(dets);
  } catch (e) { console.error(e); }
  setTimeout(loop, Math.max(60, 200 - (performance.now() - t0)));
}

async function sha(t) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ntsh|' + t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (const c of 'ntsh|' + t) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h; }
}

/* CSV 匯入 */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = [];
    } else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
$('#p_csv').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const rows = parseCSV(await f.text());
  if (rows.length && rows[0][0].includes('姓名')) rows.shift();
  await reloadPeople();
  let ok = 0, dup = 0, bad = 0;
  for (const r of rows) {
    const name = (r[0] || '').trim(), role = (r[1] || '').trim(), cls = (r[2] || '').trim();
    if (!name || !ROLES.includes(role)) { bad++; continue; }
    if (people.some(p => p.name === name && (p.cls || '') === cls)) { dup++; continue; }
    await dbPut('people', { id: uid(), name, role, cls, descriptors: [], consent: false, parentConsent: false, consentDate: '', created: new Date().toISOString() });
    ok++;
  }
  e.target.value = '';
  alert(`匯入完成:新增 ${ok} 位、重複略過 ${dup} 位、格式錯誤略過 ${bad} 筆。\n身分必須是:${ROLES.join('、')}。`);
  renderPeople();
};

    .withFaceLandmarks().withFaceDescriptors();
  if (dets.length === 0) { setRegMsg('沒有偵測到人臉,請面向鏡頭並確認光線充足。', 'var(--bad)'); return; }
  if (dets.length > 1) { setRegMsg('畫面中有多張臉,請只留一人。', 'var(--bad)'); return; }
  reg.shots.push(Array.from(dets[0].descriptor));
  // 預覽縮圖(只在畫面暫存,不儲存)
  const b = dets[0].detection.box, c = document.createElement('canvas'); c.width = c.height = 128;
  const s = Math.max(b.width, b.height) * 1.2, cx = b.x + b.width / 2, cy = b.y + b.height / 2;
  c.getContext('2d').drawImage(video2, cx - s / 2, cy - s / 2, s, s, 0, 0, 128, 128);
  reg.thumbs.push(c); updateShotUi(); setRegMsg(`第 ${reg.shots.length} 張完成。`, 'var(--ok)');
};
$('#r_save').onclick = async () => {
  const name = $('#r_name').value.trim(), role = $('#r_role').value, cls = $('#r_cls').value.trim();
  if (!name) { setRegMsg('請輸入姓名。', 'var(--bad)'); return; }
  if (!$('#r_consent').checked) { setRegMsg('請勾選同意書。', 'var(--bad)'); return; }
  if (role === '學生' && !$('#r_parent').checked) { setRegMsg('學生須勾選「已取得家長/監護人同意」。', 'var(--bad)'); return; }
  if (reg.shots.length < 3) { setRegMsg('請先拍滿 3 張照片。', 'var(--bad)'); return; }
  await reloadPeople();
  const id = $('#r_id').value || uid();
  // 檢查是否與其他人員過於相似(可能重複登錄)
  for (const m of matchers) {
    if (m.p.id === id) continue;
    for (const d of m.ds) for (const s of reg.shots) {
      if (faceapi.euclideanDistance(Float32Array.from(s), d) < 0.4) {
        if (!confirm(`這張臉與已登錄的「${m.p.name}」非常相似,可能是重複登錄。仍要儲存嗎?`)) return;
        break;
      }
    }
  }
  const old = people.find(p => p.id === id);
  const rec = {
    id, name, role, cls, descriptors: reg.shots.slice(),
    consent: true, parentConsent: role === '學生', consentDate: new Date().toISOString(),
    created: old ? old.created : new Date().toISOString()
  };
  await dbPut('people', rec); await reloadPeople();
  resetReg(); updateParentWrap(); setRegMsg(`已儲存「${name}」。`, 'var(--ok)');
};

/* ---------- 到訪紀錄 ---------- */
let lastLogRows = [];
async function renderLogs() {
  if (!$('#l_from').value) { $('#l_from').value = fmtDate(Date.now()); $('#l_to').value = fmtDate(Date.now()); }
  const from = new Date($('#l_from').value + 'T00:00:00').getTime();
  const to = new Date($('#l_to').value + 'T23:59:59').getTime();
  const role = $('#l_role').value, cls = $('#l_cls').value.trim();
  const all = await dbAll('logs');
  lastLogRows = all.filter(l => l.t >= from && l.t <= to && (!role || l.role === role) && (!cls || (l.cls || '').includes(cls))).sort((a, b) => b.t - a.t);
  const uniq = new Set(lastLogRows.map(l => l.pid)).size;
  $('#l_sum').textContent = `共 ${lastLogRows.length} 筆紀錄,${uniq} 位不同人員。` + (lastLogRows.length > 500 ? '(畫面僅顯示最新 500 筆,匯出 CSV 為全部)' : '');
  $('#l_body').innerHTML = lastLogRows.slice(0, 500).map(l => `<tr><td>${fmtTime(l.t)}</td><td>${esc(l.name)}</td><td>${esc(l.role)}</td><td>${esc(l.cls)}</td></tr>`).join('') || '<tr><td colspan="4" class="note">此區間沒有紀錄。</td></tr>';
}
$('#l_go').onclick = renderLogs;
$('#l_csv').onclick = () => {
  if (!lastLogRows.length) { alert('目前沒有可匯出的紀錄。'); return; }
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = ['時間,姓名,身分,班級/處室'].concat(lastLogRows.map(l => [fmtTime(l.t), l.name, l.role, l.cls].map(q).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `到訪紀錄_${$('#l_from').value}_${$('#l_to').value}.csv`; a.click(); URL.revokeObjectURL(a.href);
};
$('#l_purge').onclick = async () => {
  const d = prompt('要清除幾天以前的紀錄?(輸入天數,例如 90)', '90'); if (d === null) return;
  const n = parseInt(d, 10); if (!(n >= 0)) { alert('請輸入有效天數。'); return; }
  const cutoff = Date.now() - n * 86400000;
  const old = (await dbAll('logs')).filter(l => l.t < cutoff);
  if (!old.length) { alert('沒有符合條件的紀錄。'); return; }
  if (!confirm(`將刪除 ${old.length} 筆 ${n} 天前的紀錄,確定?`)) return;
  for (const l of old) await dbDel('logs', l.id);
  renderLogs();
};

/* ---------- 設定 ---------- */
function renderSettings() {
  $('#s_schoolName').value = settings.schoolName; $('#s_announce').value = settings.announce;
  $('#s_threshold').value = settings.threshold; $('#s_thOut').textContent = Number(settings.threshold).toFixed(2);
  $('#s_cooldown').value = settings.cooldown; $('#s_welcomeMs').value = settings.welcomeMs; $('#s_retention').value = settings.retentionDays;
  $('#s_voice').checked = settings.voice; $('#s_volume').value = settings.volume;
  $('#s_tplStaff').value = settings.tplStaff; $('#s_tplStudent').value = settings.tplStudent;
  $('#s_tplGuest').value = settings.tplGuest; $('#s_tplStranger').value = settings.tplStranger;
  $('#s_newpw').value = ''; $('#s_msg').textContent = '';
}
$('#s_threshold').oninput = e => { $('#s_thOut').textContent = Number(e.target.value).toFixed(2); };
$('#s_test').onclick = () => {
  const keepV = settings.voice, keepVol = settings.volume;
  settings.voice = true; settings.volume = parseFloat($('#s_volume').value);
  speak('測試語音,歡迎光臨。'); settings.voice = keepV; settings.volume = keepVol;
};
$('#s_logo').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => {
    const k = Math.min(1, 256 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    settings.logo = c.toDataURL('image/png'); saveSettings(); applySettings(); URL.revokeObjectURL(url);
    $('#s_msg').textContent = '校徽已更新。';
  };
  img.src = url; e.target.value = '';
};
$('#s_logoClear').onclick = () => { settings.logo = ''; saveSettings(); applySettings(); };
$('#s_save').onclick = async () => {
  const clamp = (v, a, b, d) => { v = parseFloat(v); return isNaN(v) ? d : Math.min(b, Math.max(a, v)); };
  settings.schoolName = $('#s_schoolName').value.trim() || DEFAULTS.schoolName;
  settings.announce = $('#s_announce').value;
  settings.threshold = clamp($('#s_threshold').value, 0.3, 0.7, 0.5);
  settings.cooldown = clamp($('#s_cooldown').value, 5, 600, 30);
  settings.welcomeMs = clamp($('#s_welcomeMs').value, 2000, 10000, 3000);
  settings.retentionDays = clamp($('#s_retention').value, 30, 3650, 365);
  settings.voice = $('#s_voice').checked; settings.volume = clamp($('#s_volume').value, 0, 1, 1);
  settings.tplStaff = $('#s_tplStaff').value || DEFAULTS.tplStaff;
  settings.tplStudent = $('#s_tplStudent').value || DEFAULTS.tplStudent;
  settings.tplGuest = $('#s_tplGuest').value || DEFAULTS.tplGuest;
  settings.tplStranger = $('#s_tplStranger').value || DEFAULTS.tplStranger;
  const np = $('#s_newpw').value;
  if (np) { if (np.length < 4) { $('#s_msg').textContent = '新密碼至少 4 碼。'; return; } settings.pwHash = await sha(np); }
  saveSettings(); applySettings(); $('#s_newpw').value = ''; $('#s_msg').textContent = '設定已儲存。';
};
$('#s_wipe').onclick = async () => {
  if (!confirm('這會刪除「所有人員的臉部資料」與「所有到訪紀錄」,且無法復原。確定要繼續?')) return;
  if (prompt('請輸入「清除」二字以確認:') !== '清除') return;
  await dbClear('people'); await dbClear('logs'); await reloadPeople(); selected.clear();
  $('#s_msg').textContent = '所有人臉與紀錄資料已清除。';
};

/* ---------- 啟動流程 ---------- */
async function boot() {
  const msg = $('#startMsg'), btn = $('#startBtn');
  msg.classList.remove('err'); btn.disabled = true;
  try {
    await loadModels(t => { msg.textContent = t; });
    msg.textContent = '正在啟用鏡頭…';
    await startCamera();
    await reloadPeople();
    $('#startOverlay').classList.add('hidden');
    running = true; $('#statusLine').textContent = `辨識中 · 已登錄 ${matchers.length} 人`;
    speak(''); // 在使用者點擊後先喚醒語音引擎
    loop();
  } catch (e) {
    msg.classList.add('err'); msg.textContent = e.message; btn.disabled = false; btn.textContent = '重試';
  }
}
$('#startBtn').onclick = boot;
$('#adminOnlyBtn').onclick = () => { $('#startOverlay').classList.add('hidden'); $('#statusLine').textContent = '未啟用鏡頭'; setView('admin'); };
setInterval(() => { if (running) $('#statusLine').textContent = `辨識中 · 已登錄 ${matchers.length} 人`; }, 5000);

(async function init() {
  fillRoleSelects(); applySettings(); updateShotUi(); updateParentWrap();
  try { await openDB(); } catch (e) { alert('無法使用本機資料庫(IndexedDB),請勿使用無痕模式。'); }
})();
</script>
